name: Portable skill checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-check.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/make_demo.py --output work/demo
      - run: python scripts/check_mesh.py work/demo/demo.stl --report work/demo/check.json
      - run: python scripts/check_environment.py
